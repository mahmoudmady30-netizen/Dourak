name: Dourak Security Release Gate
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: JavaScript syntax
        run: node --check index.js && node --check functions/index.js
      - name: Secret pattern scan
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='*.md' '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,})' .
      - name: Firestore/Storage rule sanity
        run: |
          test "$(grep -c 'match /' firestore.rules)" -gt 0
          test "$(grep -c 'match /' storage.rules)" -gt 0
      - name: Functions dependency audit
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts && npm audit --audit-level=high
      - name: Archive integrity
        run: test -f index.html && test -f firebase.json && test -f firestore.rules && test -f storage.rules
