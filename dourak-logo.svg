 <circle cx="535" cy="135" r="60" fill="url(#b3)"/>
 <path d="M460 292c0-68 34-109 75-109s75 41 75 109v18H460z" fill="url(#b3)"/>
</g>
<!-- orange clock -->
<path d="M615 72a105 105 0 1 1-66 188l38-54a40 40 0 1 0 25-71z" fill="#ff8a16"/>
<circle cx="624" cy="132" r="44" fill="#fff"/>
<path d="M624 132v-28M624 132l22 13" fill="none" stroke="#ff8a16" stroke-width="8" stroke-linecap="round"/>
