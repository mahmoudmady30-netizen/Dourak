<text x="400" y="415" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Tahoma, Arial, 'Noto Sans Arabic', sans-serif" font-size="72" font-weight="900" fill="#123b5b">دورك</text>
<text x="400" y="468" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Tahoma, Arial, 'Noto Sans Arabic', sans-serif" font-size="25" font-weight="700" fill="#54708a">ودّع الانتظار... وخد دورك</text>
</svg>
