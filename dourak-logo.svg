<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">دورك</title><desc id="desc">شعار دورك: مجموعة أشخاص مع ساعة برتقالية</desc>
<defs>
 <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38b5dc"/><stop offset="1" stop-color="#2d8fdc"/></linearGradient>
 <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2d8fdc"/><stop offset="1" stop-color="#1976d2"/></linearGradient>
 <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34bdb2"/><stop offset="1" stop-color="#18a99e"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".12"/></filter>
</defs>
<!-- people -->
<g filter="url(#shadow)">
 <circle cx="220" cy="125" r="61" fill="url(#b1)"/>
 <path d="M145 292c0-69 34-111 75-111s75 42 75 111v18H145z" fill="url(#b1)"/>
